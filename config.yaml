# gochat 配置文件（开发环境）
server:
  addr: ":8080"
  mode: "debug" # gin 运行模式：debug / release / test

mysql:
  host: "127.0.0.1"
  port: 3307
  user: "gochat"
  password: "gochat123"
  database: "gochat"
  charset: "utf8mb4"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

rabbitmq:
  url: "amqp://gochat:gochat123@127.0.0.1:5672/"

jwt:
  # ⚠️ 开源默认值，仅用于本地开发。生产环境请用环境变量注入，切勿使用此值
  secret: "change-me-in-production"
  access_expire_minutes: 120
  refresh_expire_hours: 720

# M6 微服务：gRPC 服务地址
grpc:
  user_addr: "127.0.0.1:9001"
  chat_addr: "127.0.0.1:9002"

# WebRTC 语音通话的 ICE 服务器
# 说明：同一台机器（localhost）演示不需要；跨设备/跨网络通话必须配 STUN，
#      严格 NAT（4G/企业网）还需要 TURN 中继。
rtc:
  stun_urls:
    - "stun:stun.l.google.com:19302"
    - "stun:stun.miwifi.com:3478"
    - "stun:stun.qq.com:3478"
  turn_url: ""        # 例：turn:turn.example.com:3478
  turn_user: ""       # TURN 用户名
  turn_pass: ""       # TURN 密码
