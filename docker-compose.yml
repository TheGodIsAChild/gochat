# =========================================================
# xiaohugochat —— 一键部署（应用 + MySQL + Redis + RabbitMQ）
# =========================================================
# 启动（在项目根目录）：
#   docker compose up -d --build
#
# 访问：
#   http://<服务器IP>:8080/          仿微信前端
#   http://<服务器IP>:8080/blog/     学习博客（62 篇）
#   http://<服务器IP>:8080/health    健康检查
#
# 国内网络构建加速（镜像源）：
#   REGISTRY=docker.m.daocloud.io/library docker compose up -d --build
#
# 所有可配置项见 .env.example（复制为 .env 后修改即可）
# =========================================================
name: xiaohugochat

services:
  # ---------------- 应用（Go 后端 + 前端 + 博客） ----------------
  app:
    build:
      context: .
      # app-with-blog = 含学习博客；app = 不含博客（构建更快）
      target: ${BUILD_TARGET:-app-with-blog}
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    image: xiaohugochat:${TAG:-latest}
    container_name: xiaohugochat
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # 服务
      SERVER_ADDR: ":8080"
      SERVER_MODE: "release"
      TZ: "Asia/Shanghai"
      # MySQL：容器网络里用服务名 mysql，不是 127.0.0.1
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-gochat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gochat123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gochat}
      MYSQL_CHARSET: "utf8mb4"
      # Redis
      REDIS_ADDR: "redis:6379"
      # RabbitMQ（可选依赖：连不上会自动降级为同步推送）
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-gochat}:${RABBITMQ_PASSWORD:-gochat123}@rabbitmq:5672/"
      # JWT 签名密钥 —— 部署前务必改成随机长字符串
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-120}
      JWT_REFRESH_EXPIRE_HOURS: ${JWT_REFRESH_EXPIRE_HOURS:-720}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # MQ 不是必需依赖，起来就行，不必等它健康
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ---------------- MySQL ----------------
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: xiaohugochat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gochat}
      MYSQL_USER: ${MYSQL_USER:-gochat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gochat123}
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  # ---------------- Redis ----------------
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: xiaohugochat-redis
    restart: unless-stopped
    # 开启 AOF：宕机后 refresh token 白名单/限流数据不丢
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------- RabbitMQ ----------------
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management}
    container_name: xiaohugochat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gochat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gochat123}
      TZ: "Asia/Shanghai"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
