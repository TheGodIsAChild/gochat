<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="w1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="w2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#16a34a"/></marker>
    <marker id="w3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">WebSocket 从握手到重连（含 wss）</text>
  <text x="30" y="62" font-size="13" fill="#64748b">一次连接的生命周期：Upgrade → 鉴权 → 收发 → 心跳 → 断开 → 重连</text>

  <!-- 时间轴 -->
  <line x1="120" y1="100" x2="120" y2="560" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="480" y1="100" x2="480" y2="560" stroke="#cbd5e1" stroke-width="2"/>
  <text x="120" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">浏览器</text>
  <text x="480" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Go 服务端</text>

  <!-- 1 握手 -->
  <line x1="120" y1="130" x2="475" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#w1)"/>
  <text x="150" y="123" font-size="11" fill="#2563eb">GET /ws?token=xxx  Upgrade: websocket</text>
  <line x1="480" y1="160" x2="125" y2="160" stroke="#16a34a" stroke-width="2" marker-end="url(#w2)"/>
  <text x="220" y="153" font-size="11" fill="#16a34a">101 Switching Protocols</text>
  <text x="520" y="132" font-size="10" fill="#64748b">① 升级前先校验 token（非法直接 401）</text>
  <text x="520" y="150" font-size="10" fill="#64748b">② 升级后注册到 Hub，启动读/写 goroutine</text>

  <!-- 2 收发 -->
  <line x1="120" y1="200" x2="475" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#w1)"/>
  <text x="170" y="193" font-size="11" fill="#2563eb">{"type":"text","content":"hi"}</text>
  <line x1="480" y1="230" x2="125" y2="230" stroke="#16a34a" stroke-width="2" marker-end="url(#w2)"/>
  <text x="200" y="223" font-size="11" fill="#16a34a">{"type":"ack","message_id":1}</text>
  <line x1="480" y1="260" x2="400" y2="260" stroke="#16a34a" stroke-width="2"/>
  <text x="300" y="253" font-size="11" fill="#16a34a">推送给会话其他成员</text>

  <!-- 3 心跳 -->
  <line x1="480" y1="310" x2="125" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#w3)"/>
  <text x="230" y="303" font-size="11" fill="#dc2626">Ping（服务端每 54s）</text>
  <line x1="120" y1="340" x2="475" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#w1)"/>
  <text x="250" y="333" font-size="11" fill="#2563eb">Pong（客户端自动回）</text>
  <text x="520" y="315" font-size="10" fill="#64748b">60s 收不到 pong → readDeadline 超时</text>
  <text x="520" y="333" font-size="10" fill="#64748b">→ 断开连接，清理僵尸连接</text>

  <!-- 4 断开/重连 -->
  <line x1="120" y1="390" x2="475" y2="390" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="250" y="383" font-size="11" fill="#64748b">网络断开 / Close 帧</text>
  <rect x="180" y="410" width="240" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="300" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">客户端指数退避重连</text>
  <text x="300" y="447" text-anchor="middle" font-size="10" fill="#b45309">1s → 2s → 4s → 8s → 15s（上限）</text>
  <line x1="300" y1="456" x2="300" y2="490" stroke="#2563eb" stroke-width="2" marker-end="url(#w1)"/>

  <!-- 5 wss -->
  <rect x="24" y="500" width="420" height="100" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="44" y="524" font-size="13" font-weight="700" fill="#1e3a8a">wss（WebSocket over TLS）</text>
  <text x="44" y="546" font-size="11" fill="#1d4ed8">wss://example.com/ws  ← 生产环境必须用 HTTPS/WSS</text>
  <text x="44" y="566" font-size="11" fill="#1d4ed8">Nginx 反代：proxy_http_version 1.1 + Upgrade 头</text>
  <text x="44" y="586" font-size="11" fill="#1d4ed8">localhost 的 http 属于安全上下文，本地调试可不用 wss</text>

  <rect x="480" y="500" width="456" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="524" font-size="13" font-weight="700" fill="#334155">多实例怎么办？</text>
  <text x="500" y="546" font-size="11" fill="#475569">内存 Hub 只能管本进程连接 → 跨实例推送需：</text>
  <text x="500" y="566" font-size="11" fill="#475569">Redis Pub/Sub 订阅广播 或 RabbitMQ 扇出（本项目 M7 已用它推送）</text>
  <text x="500" y="586" font-size="11" fill="#475569">在线状态也需从「内存」改「Redis + TTL」</text>
</svg>
