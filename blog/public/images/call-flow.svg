<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/></marker>
    <marker id="g6" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">WebRTC 通话信令时序</text>
  <text x="30" y="62" font-size="13" fill="#64748b">服务器只转发 SDP / ICE，音视频走 P2P 直连</text>

  <!-- 三条竖线 -->
  <rect x="60" y="84" width="150" height="34" rx="7" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="135" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">主叫 A</text>
  <rect x="370" y="84" width="140" height="34" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="440" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">信令服务器</text>
  <rect x="670" y="84" width="150" height="34" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="745" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">被叫 B</text>

  <line x1="135" y1="118" x2="135" y2="510" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="440" y1="118" x2="440" y2="510" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="745" y1="118" x2="745" y2="510" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 消息 -->
  <line x1="135" y1="150" x2="435" y2="150" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a6)"/>
  <text x="200" y="143" font-size="11" fill="#2563eb">call_invite</text>
  <line x1="440" y1="180" x2="740" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a6)"/>
  <text x="560" y="173" font-size="11" fill="#2563eb">call_incoming</text>
  <line x1="135" y1="180" x2="135" y2="180" stroke="#2563eb" stroke-width="0"/>
  <line x1="440" y1="210" x2="140" y2="210" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g6)"/>
  <text x="250" y="203" font-size="11" fill="#16a34a">call_ack</text>

  <line x1="745" y1="245" x2="445" y2="245" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a6)"/>
  <text x="560" y="238" font-size="11" fill="#2563eb">call_accept</text>
  <line x1="440" y1="275" x2="140" y2="275" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g6)"/>
  <text x="250" y="268" font-size="11" fill="#16a34a">call_accepted</text>
  <line x1="440" y1="275" x2="740" y2="275" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g6)"/>

  <line x1="135" y1="315" x2="435" y2="315" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a6)"/>
  <text x="200" y="308" font-size="11" fill="#2563eb">webrtc_offer(SDP)</text>
  <line x1="440" y1="315" x2="740" y2="315" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a6)"/>
  <line x1="745" y1="345" x2="445" y2="345" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g6)"/>
  <text x="540" y="338" font-size="11" fill="#16a34a">webrtc_answer(SDP)</text>
  <line x1="440" y1="345" x2="140" y2="345" stroke="#16a34a" stroke-width="1.8" marker-end="url(#g6)"/>

  <line x1="135" y1="385" x2="435" y2="385" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a6)"/>
  <text x="200" y="378" font-size="11" fill="#7c3aed">webrtc_ice(candidate)</text>
  <line x1="440" y1="385" x2="740" y2="385" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a6)"/>
  <line x1="745" y1="415" x2="445" y2="415" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a6)"/>
  <line x1="440" y1="415" x2="140" y2="415" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a6)"/>

  <!-- P2P 区 -->
  <rect x="180" y="440" width="520" height="40" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">===== P2P 音视频直连（不经过服务器）=====</text>

  <line x1="135" y1="505" x2="435" y2="505" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a6)"/>
  <text x="200" y="498" font-size="11" fill="#dc2626">call_end</text>
  <line x1="440" y1="505" x2="740" y2="505" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a6)"/>
</svg>
