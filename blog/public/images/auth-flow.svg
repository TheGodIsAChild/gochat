<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="r2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="g2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">双 Token 无感刷新流程</text>
  <text x="30" y="62" font-size="13" fill="#64748b">access token 短命（2h）+ refresh token 长命（30d，可撤销）</text>

  <!-- Step 1 -->
  <rect x="30" y="88" width="240" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="46" y="114" font-size="14" font-weight="700" fill="#1e3a8a">① 登录</text>
  <text x="46" y="136" font-size="12" fill="#1d4ed8">POST /api/v1/login</text>
  <text x="46" y="156" font-size="12" fill="#1d4ed8">签发 access(2h) + refresh(30d)</text>
  <text x="46" y="174" font-size="12" fill="#1d4ed8">Redis 存 refresh jti</text>

  <!-- Step 2 -->
  <rect x="320" y="88" width="250" height="96" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="336" y="114" font-size="14" font-weight="700" fill="#166534">② 正常请求</text>
  <text x="336" y="136" font-size="12" fill="#15803d">Authorization: Bearer access</text>
  <text x="336" y="156" font-size="12" fill="#15803d">中间件验签 + 校验 type=access</text>
  <text x="336" y="174" font-size="12" fill="#15803d">通过 → c.Set("userId")</text>

  <!-- Step 3 -->
  <rect x="620" y="88" width="230" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="636" y="114" font-size="14" font-weight="700" fill="#991b1b">③ access 过期</text>
  <text x="636" y="136" font-size="12" fill="#b91c1c">服务端返回 401</text>
  <text x="636" y="156" font-size="12" fill="#b91c1c">客户端拦截器捕获</text>
  <text x="636" y="174" font-size="12" fill="#b91c1c">准备调用刷新接口</text>

  <line x1="270" y1="136" x2="315" y2="136" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="570" y1="136" x2="615" y2="136" stroke="#dc2626" stroke-width="2" marker-end="url(#r2)"/>

  <!-- Step 4 -->
  <rect x="620" y="220" width="230" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="636" y="246" font-size="14" font-weight="700" fill="#92400e">④ 刷新（rotation）</text>
  <text x="636" y="268" font-size="12" fill="#b45309">POST /token/refresh</text>
  <text x="636" y="288" font-size="12" fill="#b45309">GETDEL 原子消费旧 jti</text>
  <text x="636" y="308" font-size="12" fill="#b45309">签发新 access + 新 refresh</text>

  <!-- Step 5 -->
  <rect x="320" y="220" width="250" height="110" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="336" y="246" font-size="14" font-weight="700" fill="#166534">⑤ 重试原请求</text>
  <text x="336" y="268" font-size="12" fill="#15803d">用新 access 重新请求</text>
  <text x="336" y="288" font-size="12" fill="#15803d">用户完全无感知</text>
  <text x="336" y="308" font-size="12" fill="#15803d">多个并发 401 → 单飞只刷一次</text>

  <line x1="735" y1="184" x2="735" y2="215" stroke="#16a34a" stroke-width="2" marker-end="url(#g2)"/>
  <line x1="620" y1="275" x2="575" y2="275" stroke="#2563eb" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 复用检测 -->
  <rect x="30" y="220" width="240" height="110" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="46" y="246" font-size="14" font-weight="700" fill="#6b21a8">复用检测</text>
  <text x="46" y="268" font-size="12" fill="#7e22ce">旧 jti 已不存在却仍被使用</text>
  <text x="46" y="288" font-size="12" fill="#7e22ce">→ 疑似 token 被盗</text>
  <text x="46" y="308" font-size="12" fill="#7e22ce">→ 撤销该用户全部 refresh</text>

  <!-- 登出 -->
  <rect x="30" y="380" width="820" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="50" y="406" font-size="13" font-weight="700" fill="#334155">关键设计</text>
  <text x="50" y="430" font-size="12" fill="#475569">· 为什么用 GETDEL？Exists + Del 是两条命令，并发下两个请求都可能通过 → 都签发新 token，rotation 失效。</text>
  <text x="50" y="452" font-size="12" fill="#475569">· 为什么 payload 不放密码？JWT 的 payload 只是 base64 编码，任何人可解码，签名只保证不被篡改。</text>
  <text x="50" y="474" font-size="12" fill="#475569">· 登出 = 删除 Redis 里的 refresh jti（无状态 JWT 靠服务端白名单实现「可撤销」）。</text>
</svg>
