<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#f0f7f3"/>
    </linearGradient>
    <radialGradient id="lglow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#07c160" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07c160" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#lbg)"/>
  <rect width="1600" height="520" fill="url(#lglow)"/>

  <!-- 极淡网格 -->
  <g stroke="#e6edf3" stroke-width="1">
    <path d="M0 130 H1600 M0 260 H1600 M0 390 H1600"/>
    <path d="M200 0 V520 M500 0 V520 M800 0 V520 M1100 0 V520 M1400 0 V520"/>
  </g>

  <!-- 标题 -->
  <text x="140" y="235" font-size="76" font-weight="800" fill="#1f2937" letter-spacing="2">gochat 学习博客</text>
  <text x="142" y="292" font-size="26" fill="#4b5563" letter-spacing="1">用 Go 从 0 到 1 实现一个仿微信 IM</text>
  <text x="142" y="334" font-size="17" fill="#8a949e" letter-spacing=".5">Gin · GORM · Redis · WebSocket · WebRTC · gRPC · RabbitMQ</text>
  <rect x="142" y="366" width="88" height="4" rx="2" fill="#07c160"/>

  <!-- 右侧淡淡的对话气泡装饰 -->
  <g opacity="0.55">
    <rect x="1120" y="150" width="300" height="78" rx="16" fill="#ffffff" stroke="#e6edf3" stroke-width="1.5"/>
    <rect x="1150" y="178" width="180" height="10" rx="5" fill="#eef1f4"/>
    <rect x="1150" y="200" width="120" height="10" rx="5" fill="#eef1f4"/>
    <rect x="1180" y="252" width="300" height="78" rx="16" fill="#07c160" opacity="0.12"/>
    <rect x="1210" y="280" width="200" height="10" rx="5" fill="#07c160" opacity="0.35"/>
    <rect x="1210" y="302" width="140" height="10" rx="5" fill="#07c160" opacity="0.35"/>
  </g>
</svg>
