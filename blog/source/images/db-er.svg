<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="er" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#f8fafc"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">gochat 数据库 ER 图（12 张表）</text>
  <text x="30" y="58" font-size="12" fill="#64748b">按领域分 5 组：用户 / 好友 / 聊天 / 群聊 / 通话 + 消息队列</text>

  <!-- 用户域 -->
  <rect x="24" y="80" width="200" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="40" y="104" font-size="13" font-weight="700" fill="#1e3a8a">用户域</text>
  <rect x="38" y="116" width="172" height="26" rx="4" fill="#dbeafe"/><text x="48" y="134" font-size="11" fill="#1e3a8a">users</text>
  <rect x="38" y="148" width="172" height="26" rx="4" fill="#dbeafe"/><text x="48" y="166" font-size="11" fill="#1e3a8a">user_settings (1:1)</text>
  <text x="48" y="196" font-size="10" fill="#3b82f6">username 唯一 / phone 可空唯一</text>
  <text x="48" y="212" font-size="10" fill="#3b82f6">password_hash（bcrypt）</text>

  <!-- 好友域 -->
  <rect x="250" y="80" width="240" height="230" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="266" y="104" font-size="13" font-weight="700" fill="#166534">好友域</text>
  <rect x="264" y="116" width="212" height="26" rx="4" fill="#dcfce7"/><text x="274" y="134" font-size="11" fill="#166534">friend_requests</text>
  <rect x="264" y="148" width="212" height="26" rx="4" fill="#dcfce7"/><text x="274" y="166" font-size="11" fill="#166534">friendships（双向两行）</text>
  <rect x="264" y="180" width="212" height="26" rx="4" fill="#dcfce7"/><text x="274" y="198" font-size="11" fill="#166534">friend_groups</text>
  <rect x="264" y="212" width="212" height="26" rx="4" fill="#dcfce7"/><text x="274" y="230" font-size="11" fill="#166534">blacklist</text>
  <text x="274" y="260" font-size="10" fill="#15803d">UNIQUE(from,to) 防重复申请</text>
  <text x="274" y="276" font-size="10" fill="#15803d">UNIQUE(user,friend) 防重复好友</text>
  <text x="274" y="292" font-size="10" fill="#15803d">UNIQUE(user,blocked) 黑名单</text>

  <!-- 聊天域 -->
  <rect x="516" y="80" width="230" height="230" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="532" y="104" font-size="13" font-weight="700" fill="#92400e">聊天域</text>
  <rect x="530" y="116" width="202" height="26" rx="4" fill="#fef3c7"/><text x="540" y="134" font-size="11" fill="#92400e">conversations</text>
  <rect x="530" y="148" width="202" height="26" rx="4" fill="#fef3c7"/><text x="540" y="166" font-size="11" fill="#92400e">conversation_members</text>
  <rect x="530" y="180" width="202" height="26" rx="4" fill="#fef3c7"/><text x="540" y="198" font-size="11" fill="#92400e">messages</text>
  <text x="540" y="230" font-size="10" fill="#b45309">UNIQUE(conv,user) 成员唯一</text>
  <text x="540" y="246" font-size="10" fill="#b45309">UNIQUE(sender,client_msg_id) 幂等</text>
  <text x="540" y="262" font-size="10" fill="#b45309">INDEX(conversation_id, id) 分页</text>
  <text x="540" y="278" font-size="10" fill="#b45309">单聊/群聊共用 type 区分</text>

  <!-- 群聊域 -->
  <rect x="770" y="80" width="206" height="120" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="786" y="104" font-size="13" font-weight="700" fill="#6b21a8">群聊域</text>
  <rect x="784" y="116" width="178" height="26" rx="4" fill="#f3e8ff"/><text x="794" y="134" font-size="11" fill="#6b21a8">groups</text>
  <text x="794" y="164" font-size="10" fill="#7e22ce">conversation_id 唯一</text>
  <text x="794" y="180" font-size="10" fill="#7e22ce">member_count 冗余</text>

  <!-- 通话 + MQ -->
  <rect x="770" y="220" width="206" height="90" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="786" y="244" font-size="13" font-weight="700" fill="#991b1b">通话域</text>
  <rect x="784" y="256" width="178" height="26" rx="4" fill="#fee2e2"/><text x="794" y="274" font-size="11" fill="#991b1b">call_records</text>
  <text x="794" y="298" font-size="10" fill="#b91c1c">status 状态机</text>

  <rect x="250" y="340" width="726" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="266" y="364" font-size="13" font-weight="700" fill="#334155">消息队列域（M7）</text>
  <rect x="264" y="374" width="220" height="26" rx="4" fill="#e2e8f0"/><text x="274" y="392" font-size="11" fill="#334155">outbox_messages</text>
  <text x="500" y="392" font-size="10" fill="#475569">业务事务内写事件 → worker 轮询发 MQ → 标记已发送</text>

  <!-- 关系 -->
  <line x1="210" y1="150" x2="264" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#er)"/>
  <line x1="476" y1="150" x2="530" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#er)"/>
  <line x1="746" y1="130" x2="784" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#er)"/>
  <line x1="732" y1="440" x2="732" y2="425" stroke="#64748b" stroke-width="1.5"/>

  <!-- 底部说明 -->
  <rect x="24" y="440" width="700" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="466" font-size="13" font-weight="700" fill="#334155">表设计 5 条原则</text>
  <text x="44" y="492" font-size="12" fill="#475569">① 按领域分表：一个文件/一张表只服务一个业务概念</text>
  <text x="44" y="514" font-size="12" fill="#475569">② 软删除：status 或 deleted_at，保留历史（IM 需要审计/回溯）</text>
  <text x="44" y="536" font-size="12" fill="#475569">③ 好友双向两行：查「我的好友」只走 user_id 索引，不用 OR</text>
  <text x="44" y="558" font-size="12" fill="#475569">④ 唯一索引兜底并发：uk_from_to / uk_user_friend / uk_sender_client</text>
  <text x="44" y="580" font-size="12" fill="#475569">⑤ 冗余换读性能：conversations.last_message_* / groups.member_count</text>
</svg>
