<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
  <rect width="860" height="470" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">gochat 系统架构</text>
  <text x="30" y="62" font-size="13" fill="#64748b">单体（M0–M5）→ 微服务（M6）+ 消息队列（M7）</text>

  <!-- 客户端 -->
  <rect x="30" y="95" width="150" height="86" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="105" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">浏览器客户端</text>
  <text x="105" y="148" text-anchor="middle" font-size="12" fill="#c2410c">仿微信前端</text>
  <text x="105" y="166" text-anchor="middle" font-size="12" fill="#c2410c">HTTP + WebSocket</text>

  <!-- gateway -->
  <rect x="250" y="95" width="170" height="86" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="335" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Gateway :8080</text>
  <text x="335" y="146" text-anchor="middle" font-size="12" fill="#1d4ed8">Gin 路由 / JWT 鉴权</text>
  <text x="335" y="164" text-anchor="middle" font-size="12" fill="#1d4ed8">限流 / WebSocket</text>

  <!-- gRPC services -->
  <rect x="490" y="70" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="570" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">User 服务 :9001</text>
  <text x="570" y="118" text-anchor="middle" font-size="12" fill="#15803d">用户 / 好友</text>
  <rect x="490" y="156" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="570" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Chat 服务 :9002</text>
  <text x="570" y="204" text-anchor="middle" font-size="12" fill="#15803d">会话 / 消息 / 群</text>

  <!-- 中间件 -->
  <rect x="250" y="250" width="150" height="72" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">MySQL</text>
  <text x="325" y="298" text-anchor="middle" font-size="12" fill="#64748b">12 张表 / 3307</text>
  <rect x="425" y="250" width="150" height="72" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Redis</text>
  <text x="500" y="298" text-anchor="middle" font-size="12" fill="#64748b">refresh token / 限流</text>
  <rect x="600" y="250" width="180" height="72" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">RabbitMQ</text>
  <text x="690" y="298" text-anchor="middle" font-size="12" fill="#64748b">异步推送 / Outbox</text>

  <!-- 箭头 -->
  <line x1="180" y1="120" x2="245" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="196" y="112" font-size="11" fill="#475569">HTTP/WS</text>
  <line x1="420" y1="112" x2="485" y2="100" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <line x1="420" y1="140" x2="485" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#g)"/>
  <text x="432" y="98" font-size="11" fill="#16a34a">gRPC</text>
  <line x1="325" y1="181" x2="325" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="181" x2="500" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="690" y1="226" x2="690" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- 底部说明 -->
  <rect x="30" y="356" width="800" height="86" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="50" y="382" font-size="13" font-weight="700" fill="#334155">设计要点</text>
  <text x="50" y="404" font-size="12" fill="#475569">1. 对外只暴露 Gateway，内部服务走 gRPC，鉴权统一在入口做</text>
  <text x="50" y="424" font-size="12" fill="#475569">2. 消息落库后写 outbox，后台 worker 发 MQ，consumer 异步推 WebSocket（最终一致性）</text>
</svg>
