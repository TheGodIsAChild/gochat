<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f2a3d"/>
      <stop offset="100%" stop-color="#0d3b2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#07c160" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07c160" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- 抽象节点网络 -->
  <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M180 700 L380 560 L560 660 L740 500 L940 620 L1150 470 L1380 560"/>
    <path d="M260 420 L460 300 L660 400 L860 240 L1080 360 L1300 260"/>
    <path d="M380 560 L460 300"/>
    <path d="M740 500 L860 240"/>
    <path d="M1150 470 L1300 260"/>
  </g>
  <g fill="#07c160">
    <circle cx="180" cy="700" r="7"/><circle cx="560" cy="660" r="7"/>
    <circle cx="940" cy="620" r="7"/><circle cx="1380" cy="560" r="7"/>
    <circle cx="260" cy="420" r="7"/><circle cx="660" cy="400" r="7"/>
    <circle cx="1080" cy="360" r="7"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="380" cy="560" r="9"/><circle cx="740" cy="500" r="9"/><circle cx="1150" cy="470" r="9"/>
    <circle cx="460" cy="300" r="9"/><circle cx="860" cy="240" r="9"/><circle cx="1300" cy="260" r="9"/>
  </g>

  <!-- 标题 -->
  <text x="800" y="430" text-anchor="middle" font-size="120" font-weight="800" fill="#ffffff" letter-spacing="6">gochat</text>
  <text x="800" y="500" text-anchor="middle" font-size="30" fill="#a7f3d0" letter-spacing="3">用 Go 从 0 到 1 实现一个仿微信 IM</text>
  <text x="800" y="556" text-anchor="middle" font-size="20" fill="#94a3b8" letter-spacing="2">Gin · GORM · Redis · WebSocket · WebRTC · gRPC · RabbitMQ</text>

  <!-- 装饰线 -->
  <rect x="600" y="600" width="400" height="3" rx="2" fill="#07c160" opacity="0.8"/>
</svg>
