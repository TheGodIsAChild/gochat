# =========================================================
# gochat 学习博客 —— Fluid 主题配置（阅读模式）
# 设计目标：白底、细导航、无大图、无动效、内容居中窄栏
# 把原来的「科技感」改成「舒适的阅读感」
# =========================================================

# 代码块：浅色主题，长时间看不刺眼
code:
  copy_btn: true
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: "Atom One Light"
      bg_color: "#f8f9fa"

# 关闭暗色模式（避免跟随系统变深色）
dark_mode:
  enable: false
  default: light

# 配色：白底 + 深灰字 + 低饱和蓝链接
color:
  body_bg_color: "#ffffff"
  navbar_bg_color: "#ffffff"
  navbar_text_color: "#2f3437"
  subtitle_color: "#2f3437"
  text_color: "#2f3437"
  sec_text_color: "#6b7783"
  post_text_color: "#2f3437"
  post_heading_color: "#1f2328"
  post_link_color: "#2b6cb0"
  post_link_color_dark: "#2b6cb0"
  link_hover_color: "#1a4a85"
  link_hover_bg_color: "#f5f7f9"
  line_color: "#eef1f4"
  board_color: "#ffffff"

# 字体
font:
  font_size: "16px"
  font_family: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"

# 自定义样式
custom_css: /css/custom.css

# 导航栏：纯白、无毛玻璃
navbar:
  blog_title: "gochat 学习博客"
  ground_glass:
    enable: false
    px: 0
    alpha: 1
  menu:
    - { key: "home", link: "/", name: "首页", icon: "iconfont icon-home-fill" }
    - { key: "catalog", link: "/catalog/", name: "目录", icon: "iconfont icon-books" }
    - { key: "archive", link: "/archives/", name: "归档", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", name: "分类", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", name: "标签", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", name: "关于", icon: "iconfont icon-user-fill" }

# 搜索（未安装 hexo-generator-search，关闭）
search:
  enable: false

# 首页：浅色 banner，高度降低到 30%
index:
  banner_img: /images/hero-light.svg
  banner_img_height: 30
  banner_mask_alpha: 0.0
  slogan:
    enable: false
  post_url: /archives/
  excerpt_link: "阅读全文"

# 文章页：极窄的浅色顶部条
post:
  banner_img: /images/hero-light.svg
  banner_img_height: 12
  banner_mask_alpha: 0.0
  toc:
    enable: true
    max_depth: 3
    min_depth: 0
    expand: true
  comments:
    enable: false
  math:
    enable: false
    specific: false

# 归档/分类/标签页
archive:
  banner_img: /images/hero-light.svg
  banner_img_height: 14
  banner_mask_alpha: 0.0
category:
  banner_img: /images/hero-light.svg
  banner_img_height: 14
  banner_mask_alpha: 0.0
tag:
  banner_img: /images/hero-light.svg
  banner_img_height: 14
  banner_mask_alpha: 0.0

# 关于页
about:
  enable: false

# 页脚
footer:
  content: '
    <span style="color:#8a949e">gochat 学习博客 · 用 Go 从 0 到 1 实现一个仿微信 IM</span>
    <span style="color:#b8c0c8"> · Powered by </span>
    <a href="https://hexo.io" target="_blank" rel="noopener"><span>Hexo</span></a>
    <span style="color:#b8c0c8"> & </span>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="noopener"><span>Fluid</span></a>
  '
  statistics:
    enable: false
